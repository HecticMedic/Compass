<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="compass-root" content="../">
  <meta name="theme-color" content="#faf7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icon-180.png">
  <link rel="stylesheet" href="../assets/style.css">
  <title>Chores</title>
</head>
<body>
  <header class="top"><a class="back" href="../">‹ Home</a><h1>Chores</h1></header>
  <main>
    <button class="btn block" id="new-chore" style="margin-top:8px">+ New chore</button>
    <button class="btn secondary block ai-only hidden" id="ai-chores" style="margin-top:8px">✨ Suggest chores I might be missing</button>
    <div id="suggested" class="hidden">
      <h2>Ideas from Claude</h2>
      <ul class="list" id="suggested-list"></ul>
    </div>
    <div id="groups"></div>
  </main>

  <dialog id="chore-dialog">
    <form method="dialog" id="chore-form">
      <h3 id="chore-dialog-title">New chore</h3>
      <label for="chore-name">What needs doing?</label>
      <input id="chore-name" required placeholder="e.g. Change the bed sheets">
      <label for="chore-repeat">Repeats</label>
      <select id="chore-repeat">
        <option value="none">Doesn't repeat</option>
        <option value="day">Every day</option>
        <option value="3day">Every 3 days</option>
        <option value="week">Every week</option>
        <option value="2week">Every 2 weeks</option>
        <option value="month">Every month</option>
        <option value="3month">Every 3 months</option>
      </select>
      <label for="chore-due">Next due</label>
      <input type="date" id="chore-due" required>
      <div class="actions">
        <button class="btn danger" type="button" id="chore-delete" style="margin-right:auto">Delete</button>
        <button class="btn secondary" type="button" id="chore-cancel">Cancel</button>
        <button class="btn" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="../assets/common.js"></script>
  <script>
    const REPEAT_LABELS = {
      none: '', day: 'Daily', '3day': 'Every 3 days', week: 'Weekly',
      '2week': 'Every 2 weeks', month: 'Monthly', '3month': 'Every 3 months',
    };

    let chores = Store.get('chores', []);
    const save = () => Store.set('chores', chores);

    function render() {
      const today = isoDate();
      chores.sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));
      const groups = [
        ['Overdue', c => c.due < today],
        ['Today', c => c.due === today],
        ['This week', c => c.due > today && daysBetween(today, c.due) <= 7],
        ['Later', c => daysBetween(today, c.due) > 7],
      ];

      const el = document.getElementById('groups');
      if (!chores.length) {
        el.innerHTML = '<div class="empty" style="margin-top:16px">No chores yet. Add the regular jobs around the house, like laundry, bins or watering plants.</div>';
        return;
      }

      const doneToday = Store.get('chores:doneToday', {});
      const doneCount = doneToday.date === today ? doneToday.count : 0;

      el.innerHTML = groups.map(([title, test]) => {
        const items = chores.filter(test);
        if (!items.length) return '';
        return `
          <h2>${title} <span class="count">(${items.length})</span></h2>
          <ul class="list">
            ${items.map(c => `
              <li data-id="${c.id}">
                <button class="check" data-act="done" aria-label="Mark done">✓</button>
                <div class="grow" data-act="edit" style="cursor:pointer">
                  <div class="title">${esc(c.name)}</div>
                  <div class="small muted">
                    ${c.due < today ? `<span class="pill bad">${friendlyDate(c.due)}</span>` : friendlyDate(c.due)}
                    ${REPEAT_LABELS[c.repeat] ? ' · ' + REPEAT_LABELS[c.repeat] : ''}
                  </div>
                </div>
              </li>`).join('')}
          </ul>`;
      }).join('') + (doneCount
        ? `<p class="muted small" style="text-align:center;margin-top:20px">✨ ${doneCount} chore${doneCount === 1 ? '' : 's'} done today</p>`
        : '');
    }

    document.getElementById('groups').addEventListener('click', e => {
      const target = e.target.closest('[data-act]');
      if (!target) return;
      const id = target.closest('li').dataset.id;
      const chore = chores.find(c => c.id === id);

      if (target.dataset.act === 'edit') return openChore(chore);

      // Mark done: animate the tick, then reschedule or remove.
      target.classList.add('on');
      const today = isoDate();
      const tally = Store.get('chores:doneToday', {});
      Store.set('chores:doneToday', { date: today, count: (tally.date === today ? tally.count : 0) + 1 });
      setTimeout(() => {
        if (chore.repeat === 'none') {
          chores = chores.filter(c => c.id !== id);
        } else {
          // Schedule from today so a late chore doesn't come straight back as overdue.
          chore.due = nextDue(chore.repeat, today > chore.due ? today : chore.due);
        }
        save();
        render();
      }, 350);
    });

    // ---- Add / edit ----
    const dialog = document.getElementById('chore-dialog');
    let editingId = null;

    function openChore(chore) {
      editingId = chore?.id || null;
      document.getElementById('chore-dialog-title').textContent = chore ? 'Edit chore' : 'New chore';
      document.getElementById('chore-name').value = chore?.name || '';
      document.getElementById('chore-repeat').value = chore?.repeat || 'week';
      document.getElementById('chore-due').value = chore?.due || isoDate();
      document.getElementById('chore-delete').classList.toggle('hidden', !chore);
      dialog.showModal();
    }

    document.getElementById('new-chore').addEventListener('click', () => openChore(null));
    document.getElementById('chore-cancel').addEventListener('click', () => dialog.close());

    document.getElementById('chore-delete').addEventListener('click', () => {
      if (!confirm('Delete this chore?')) return;
      chores = chores.filter(c => c.id !== editingId);
      save();
      render();
      dialog.close();
    });

    document.getElementById('chore-form').addEventListener('submit', () => {
      const name = document.getElementById('chore-name').value.trim();
      const repeat = document.getElementById('chore-repeat').value;
      const due = document.getElementById('chore-due').value || isoDate();
      if (!name) return;
      const existing = chores.find(c => c.id === editingId);
      if (existing) Object.assign(existing, { name, repeat, due });
      else chores.push({ id: uid(), name, repeat, due });
      save();
      render();
    });

    // ---- ✨ Suggestions ----
    let suggestions = [];

    function renderSuggestions() {
      document.getElementById('suggested').classList.toggle('hidden', !suggestions.length);
      document.getElementById('suggested-list').innerHTML = suggestions.map((s, i) => `
        <li>
          <div class="grow">
            <div class="title">${esc(s.name)}</div>
            <div class="small muted">${REPEAT_LABELS[s.repeat] || ''}</div>
          </div>
          <button class="btn secondary" data-i="${i}">Add</button>
        </li>`).join('');
    }

    document.getElementById('ai-chores').addEventListener('click', e => {
      withAI(e.currentTarget, 'Thinking…', async AI => {
        suggestions = await AI.suggestChores(chores.map(c => c.name));
        renderSuggestions();
      });
    });

    document.getElementById('suggested-list').addEventListener('click', e => {
      const btn = e.target.closest('button[data-i]');
      if (!btn) return;
      const [s] = suggestions.splice(Number(btn.dataset.i), 1);
      chores.push({ id: uid(), name: s.name, repeat: s.repeat, due: isoDate() });
      save();
      render();
      renderSuggestions();
    });

    render();
  </script>
</body>
</html>
